<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kroniki Westeros — Kompendium RPG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet"
  />
  <script>
    if (window.tailwind) {
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['Cinzel', 'Georgia', 'serif'],
              serif: ['Cormorant Garamond', 'Georgia', 'serif'],
              body: ['EB Garamond', 'Georgia', 'serif'],
            },
            colors: {
              obsidian: '#0c0a09',
              charcoal: '#14110f',
              leather: '#1d1714',
              parchment: '#e9dec8',
              parchmentDark: '#d7c7a9',
              ink: '#231b15',
              inkMuted: '#5b4b3c',
              brass: '#b88a44',
              goldleaf: '#d4a656',
              crimson: '#8a2323',
            },
          },
        },
      };
    }
  </script>
  <style>
    :root {
      --bg-dark: #0c0a09;
      --parchment-light: #efe5d1;
      --parchment-base: #e3d4b7;
      --parchment-shadow: #cbb792;
      --ink-color: #211913;
      --brass-border: rgba(184, 138, 68, 0.42);
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background-color: var(--bg-dark);
      color: #f3ead8;
      font-family: 'EB Garamond', Georgia, serif;
      background-image:
        radial-gradient(circle at 50% 0%, rgba(184, 138, 68, 0.11), transparent 52%),
        radial-gradient(circle at 12% 25%, rgba(138, 35, 35, 0.08), transparent 42%),
        radial-gradient(circle at 88% 35%, rgba(68, 92, 122, 0.08), transparent 45%),
        linear-gradient(180deg, #0d0b0a 0%, #120f0d 55%, #090807 100%);
      min-height: 100vh;
    }

    .font-display {
      font-family: 'Cinzel', Georgia, serif;
    }

    .font-serif {
      font-family: 'Cormorant Garamond', Georgia, serif;
    }

    .font-body {
      font-family: 'EB Garamond', Georgia, serif;
    }

    /* Awaryjne klasy siatki i układu na wypadek braku załadowania Tailwind CDN */
    .mx-auto { margin-left: auto; margin-right: auto; }
    .max-w-[1440px] { max-width: 1440px; }
    .max-w-5xl { max-width: 64rem; }
    .max-w-2xl { max-width: 42rem; }
    .grid { display: grid; gap: 1.5rem; }
    .grid-cols-1 { grid-template-columns: repeat(1, minmax(0, 1fr)); }
    @media (min-width: 768px) {
      .md\:grid-cols-2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .md\:col-span-2 { grid-column: span 2 / span 2; }
    }
    @media (min-width: 1024px) {
      .lg\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .lg\:grid-cols-12 { grid-template-columns: repeat(12, minmax(0, 1fr)); }
      .lg\:col-span-4 { grid-column: span 4 / span 4; }
      .lg\:col-span-8 { grid-column: span 8 / span 8; }
    }
    @media (min-width: 1280px) {
      .xl\:grid-cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .xl\:grid-cols-4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .xl\:col-span-2 { grid-column: span 2 / span 2; }
    }
    .flex { display: flex; }
    .flex-wrap { flex-wrap: wrap; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-3 { gap: 0.75rem; }
    .gap-6 { gap: 1.5rem; }
    .space-y-6 > * + * { margin-top: 1.5rem; }
    .space-y-8 > * + * { margin-top: 2rem; }
    .space-y-10 > * + * { margin-top: 2.5rem; }
    .p-6 { padding: 1.5rem; }
    .p-7 { padding: 1.75rem; }
    .px-4 { padding-left: 1rem; padding-right: 1rem; }
    .py-3 { padding-top: 0.75rem; padding-bottom: 0.75rem; }
    .py-8 { padding-top: 2rem; padding-bottom: 2rem; }
    .rounded-lg { border-radius: 0.5rem; }
    .rounded { border-radius: 0.25rem; }
    .hidden { display: none !important; }

    .parchment-card {
      background:
        radial-gradient(circle at top left, rgba(255, 250, 238, 0.65), transparent 55%),
        linear-gradient(155deg, var(--parchment-light) 0%, var(--parchment-base) 68%, var(--parchment-shadow) 100%);
      color: var(--ink-color);
      border: 1px solid rgba(130, 96, 48, 0.55);
      box-shadow:
        inset 0 0 0 1px rgba(255, 248, 232, 0.45),
        inset 0 0 28px rgba(120, 88, 45, 0.16),
        0 14px 32px rgba(0, 0, 0, 0.55);
    }

    .tome-card {
      background:
        radial-gradient(circle at 50% 0%, rgba(212, 166, 86, 0.14), transparent 65%),
        linear-gradient(175deg, rgba(33, 26, 22, 0.96) 0%, rgba(18, 14, 12, 0.98) 100%);
      border: 1px solid var(--brass-border);
      color: #f3ead8;
      box-shadow:
        inset 0 1px 0 rgba(255, 232, 185, 0.12),
        0 12px 28px rgba(0, 0, 0, 0.55);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .tome-card:hover {
      transform: translateY(-4px);
      border-color: rgba(212, 166, 86, 0.85);
      box-shadow:
        inset 0 1px 0 rgba(255, 236, 196, 0.24),
        0 18px 36px rgba(0, 0, 0, 0.72),
        0 0 24px rgba(184, 138, 68, 0.14);
    }

    .dropcap::first-letter {
      float: left;
      font-family: 'Cinzel', Georgia, serif;
      font-size: 3.15rem;
      line-height: 0.88;
      padding-top: 0.18rem;
      padding-right: 0.55rem;
      padding-bottom: 0.08rem;
      color: #7c1d1d;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(255, 250, 238, 0.7);
    }

    .ornate-divider {
      display: flex;
      align-items: center;
      gap: 0.85rem;
      color: rgba(212, 166, 86, 0.65);
    }

    .ornate-divider::before,
    .ornate-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(184, 138, 68, 0.45), transparent);
    }

    .parchment-divider {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      color: rgba(124, 29, 29, 0.75);
    }

    .parchment-divider::before,
    .parchment-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(110, 79, 38, 0.35), transparent);
    }

    .nav-btn {
      background: transparent;
      color: #d6d3d1;
      cursor: pointer;
    }

    .nav-btn.active {
      background: linear-gradient(180deg, rgba(212, 166, 86, 0.24), rgba(138, 35, 35, 0.22));
      color: #f6dfad;
      border-color: rgba(212, 166, 86, 0.65);
      box-shadow: inset 0 1px 0 rgba(255, 238, 200, 0.2);
    }

    .tab-panel {
      display: none;
      animation: fadeIn 0.25s ease;
    }

    .tab
